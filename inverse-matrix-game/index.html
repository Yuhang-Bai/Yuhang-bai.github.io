<div class="container">

</div>

<script>
'use strict';
const STORE = 'inverse-quest-student-v3';
const STAGES = [
 {name:'逆元法则',desc:'四个真假命题',symbol:'≡',subtitle:'看清定义，识破陷阱',tag:'01'},
 {name:'可逆侦测',desc:'从五个矩阵中选出可逆者',symbol:'|A|',subtitle:'行列式，就是第一道钥匙',tag:'02'},
 {name:'伴随之钥',desc:'亲手拼出伴随矩阵',symbol:'A*',subtitle:'代数余子式，还要转置',tag:'03'},
 {name:'逆阵工坊',desc:'完成含分数的求逆计算',symbol:'⅓',subtitle:'不仅要会判断，还要会计算',tag:'04'},
 {name:'乘法迷宫',desc:'连续破解三种乘法顺序',symbol:'⇄',subtitle:'左乘、右乘，位置不能错',tag:'05'},
 {name:'终极破阵',desc:'矩阵恢复与奇异陷阱',symbol:'X',subtitle:'用你掌握的全部本领通关',tag:'06'},
];
const TRUE_FALSE = [
 {q:'若存在同阶方阵 B，使 AB = BA = E，则 A 可逆。',a:true,why:'这正是逆矩阵的定义，B 就是 A 的逆矩阵。'},
 {q:'只要 A 不是零矩阵，A 就一定存在逆矩阵。',a:false,why:'非零不等于可逆。例如两行成比例的非零方阵，行列式为 0，不可逆。'},
 {q:'若 A 可逆，则 (A⁻¹)⁻¹ = A。',a:true,why:'A 与 A⁻¹ 的两侧乘积都是 E，所以它们互为逆矩阵。'},
 {q:'求 A⁻¹，只需把 A 的每个非零元素分别取倒数。',a:false,why:'逆矩阵是由整个矩阵的乘法关系定义的，而不是元素逐个取倒数。'}

const DET_MATS = [
 {name:'M₁',arr:[[2,1],[1,1]],det:1},
 {name:'M₂',arr:[[1,2],[2,4]],det:0},
 {name:'M₃',arr:[[0,1],[2,0]],det:-2},
 {name:'M₄',arr:[[3,6],[1,2]],det:0},
 {name:'M₅',arr:[[2,-1],[4,3]],det:10}
];
const FORMULAS = [
 {q:'AX = Y',tag:'第一重：未知矩阵在右侧',choices:['A⁻¹Y','YA⁻¹','AY⁻¹','A⁻¹YA'],correct:0,why:'等式两边左乘 A⁻¹：A⁻¹AX = A⁻¹Y，所以 X = A⁻¹Y。'},
 {q:'XA = Y',tag:'第二重：未知矩阵在左侧',choices:['A⁻¹Y','YA⁻¹','AY','YA'],correct:1,why:'等式两边右乘 A⁻¹：XAA⁻¹ = YA⁻¹，所以 X = YA⁻¹。'},
 {q:'AXB = Y',tag:'第三重：双侧机关',choices:['B⁻¹YA⁻¹','A⁻¹YB⁻¹','A⁻¹B⁻¹Y','YAB'],correct:1,why:'若 A、B 均可逆，先左乘 A⁻¹，再右乘 B⁻¹，得到 X = A⁻¹YB⁻¹。'}
];
const SPECIAL = [
 {q:'方程组的系数矩阵两行成比例，且两条方程相容。该方程组有几组解？',target:'many',why:'第二条方程没有提供新的独立约束，因此有无穷多组解。'},
 {q:'仍然是相同的奇异系数矩阵，但两次测量互相矛盾。该方程组有几组解？',target:'none',why:'把第一式乘 2 应得到右端 6，却给出了 7，因此方程组无解。'}
];
const defaultState=()=>({phase:'home',stage:0,step:0,selection:null,multiselected:[],draft:[],errors:0,hintUsed:false,hintStep:-1,hints:0,completed:[],success:false,feedback:'',feedbackWhy:'',startedAt:0,displayName:''});
let state=defaultState();
try{const saved=JSON.parse(localStorage.getItem(STORE)||'null');if(saved&&Number.isInteger(saved.stage)&&saved.stage>=0&&saved.stage<=6&&Array.isArray(saved.completed)&&['home','play','clear','finish'].includes(saved.phase))state={...defaultState(),...saved,success:false,feedback:'',feedbackWhy:''};}catch(e){}
const root=document.getElementById('root');
const headerStage=document.getElementById('headerStage');
const restartTop=document.getElementById('restartTop');
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const mat=(arr,cls='mat-med')=>`<span class="matrix ${cls}" style="--cols:${arr[0].length}">${arr.flat().map(v=>`<span class="cell">${esc(v)}</span>`).join('')}</span>`;
const matInput=(prefix='m',rows=2,cols=2)=>`<span class="matrix with-inputs" style="--cols:${cols}">${Array.from({length:rows*cols},(_,i)=>`<span class="cell"><input class="answer-input" data-input="${prefix}${i}" aria-label="第 ${Math.floor(i/cols)+1} 行第 ${i%cols+1} 列" placeholder="?" value="${esc(state.draft[prefix==='inv'?i+1:i]||'')}" inputmode="text" autocomplete="off"></span>`).join('')}</span>`;
const formulaText=(f)=>esc(f).replaceAll('⁻¹','<sup>−1</sup>');
function save(){try{localStorage.setItem(STORE,JSON.stringify({...state,success:false,feedback:'',feedbackWhy:''}));}catch(e){}}
function allScore(){return state.completed.reduce((s,l)=>s+l.score,0)}
function scrollTop(){window.scrollTo({top:0,behavior:'smooth'})}
function home(){headerStage.textContent='六重矩阵试炼';restartTop.hidden=true;const started=state.completed.length>0||state.stage>0||state.phase==='play'||state.phase==='clear';return `<div class="homepage"><section class="hero"><div><div class="eyebrow">MATRIX CHALLENGE · 6 STAGES</div><h1 class="headline">解开矩阵的<br><span class="gradient-word">逆向密码</span></h1><p class="lede">六道阵门正在等待开启。从逆矩阵定义出发，识别可逆矩阵、组装伴随矩阵，再用正确的乘法顺序破解最终机关。</p><div class="hero-actions"><button class="button" data-act="start">${started?'继续闯关':'开始破阵'} &nbsp;↗</button><span class="tiny">不限时 · 可使用提示 · 答错可重试</span></div><div class="hero-note">游戏进度保存在当前浏览器；通关后可保存成绩截图。</div></div><div class="visual" aria-hidden="true"><div class="orb"><div class="grid-motif"></div></div><div class="orbit-text">SYSTEM: INVERSE</div><div class="hero-matrix"><div class="formula">A⁻¹ · A = E</div><div class="matrix-line" style="margin-top:17px;color:#77eee1">${mat([[2,-1],[-1,1]],'mat-large')}<span class="mathsymbol">×</span>${mat([[1,1],[1,2]],'mat-large')}</div></div><div class="orbit-tag">UNLOCK / 06</div></div></section><section class="journey"><h2 class="section-title">六重阵门</h2><p class="section-note">从概念到计算，越往后越需要综合运用已学知识。</p><div class="stage-grid">${STAGES.map((s,i)=>`<article class="stage-preview" data-num="${s.tag}"><div class="stage-top"><span class="stage-count">STAGE ${s.tag}</span><span class="stage-glyph">${s.symbol}</span></div><strong>${s.name}</strong><p>${s.desc}</p></article>`).join('')}</div></section></div>`}
function layout(title,sub,content){const idx=state.stage;const frac=(idx+(state.phase==='clear'?1:0))/6*100;headerStage.textContent=state.phase==='clear'?'阵门已破解':`第 ${idx+1} / 6 关`;restartTop.hidden=false;return `<div class="playpage"><div class="game-head"><div class="game-head-left"><small>破阵进度　${state.completed.length} / 6 座阵门</small><h1>${esc(title)}</h1><div class="progressbar" aria-label="总进度"><div style="width:${frac}%"></div></div></div><div class="scorebox"><div class="score-item"><strong>${allScore()}</strong><span>当前积分</span></div></div></div><div class="playlayout"><section class="board"><div class="board-head"><div class="eyebrow">STAGE ${STAGES[idx]?.tag||'06'} / INVERSE QUEST</div><h2>${esc(title)}</h2><p>${esc(sub)}</p></div>${content}</section><aside class="side"><h3>你的破阵路线</h3><div class="route">${STAGES.map((s,i)=>`<div class="route-item ${i<state.completed.length?'is-done':i===state.stage?'is-current':''}"><span class="route-number">${i<state.completed.length?'✓':i+1}</span><span>${s.name}</span><span class="route-flag">${i<state.completed.length?'已解锁':i===state.stage?'进行中':'未解锁'}</span></div>`).join('')}</div><p class="side-tip">每关满分 100 分；使用提示或答错会减少本关积分，但不会阻止通关。<br>仔细观察乘法顺序，它可能是破阵的关键。</p></aside></div></div>`}
function selectionButton(text,val,selected,css='choice',extra=''){return `<button type="button" class="${css} ${selected?'is-selected':''}" data-act="pick" data-value="${esc(val)}" aria-pressed="${selected?'true':'false'}" ${extra}><span class="choice-mark" aria-hidden="true">✓</span><span class="choice-text">${text}</span></button>`}
function feedback(){if(!state.feedback)return '';return `<div class="status ${state.success?'good':'bad'}" role="status" aria-live="polite"><strong>${state.success?'机关破解成功':'机关尚未解开'}</strong><p>${esc(state.feedback)}</p>${state.success&&state.feedbackWhy?`<p style="margin-top:6px">${esc(state.feedbackWhy)}</p>`:''}</div>`}
function bottomAction(){if(state.success)return `<div class="question-action"><span class="tiny">已记录这一题的答案</span><button type="button" class="button" data-act="next">${isLastStep()?'完成本关':'下一题'} →</button></div>`;return `<div class="question-action"><button type="button" class="ghostbtn" data-act="hint" ${state.hintUsed?'disabled':''}>${state.hintUsed?'提示已使用':'获取提示（−12分）'}</button><button type="button" class="button" data-act="submit">确认答案 →</button></div>`}
function hintLine(){if(!state.hintUsed||state.hintStep!==state.step)return '';return `<div class="hint-box"><strong>破阵提示</strong><p>${getHint()}</p></div>`}
function isLastStep(){return state.stage===0?state.step===TRUE_FALSE.length-1:state.stage===4?state.step===FORMULAS.length-1:state.stage===5?state.step===2:true}
function stageProblem(){const s=state.stage;let body='';
 if(s===0){const q=TRUE_FALSE[state.step];body=`<div class="challenge-meta"><span>真假辨析 ${state.step+1} / ${TRUE_FALSE.length}</span><strong>${'▰'.repeat(state.step+1)}${'▱'.repeat(TRUE_FALSE.length-state.step-1)}</strong></div><p class="problem-title">${esc(q.q)}</p><p class="problem-sub">这是正确的数学判断，还是伪装过的陷阱？</p><div class="choose-row">${selectionButton('正确','true',state.selection==='true')}${selectionButton('错误','false',state.selection==='false')}</div>`}
 if(s===1){body=`<div class="challenge-meta"><span>多选任务</span><strong>选出全部可逆矩阵</strong></div><p class="problem-title">五个二阶方阵中，恰好有三个可逆。请全部选中。</p><p class="problem-sub">记住：对于二阶矩阵，先计算 ad − bc。</p><div class="select-grid">${DET_MATS.map((m,i)=>`<button type="button" class="matrixchoice ${state.multiselected.includes(i)?'is-selected':''}" aria-pressed="${state.multiselected.includes(i)}" data-act="toggle" data-index="${i}"><strong>${m.name} ${state.multiselected.includes(i)?'✓':''}</strong>${mat(m.arr)}</button>`).join('')}</div><p class="stagenote">已选择 ${state.multiselected.length} / 3 个矩阵</p>`}
 if(s===2){body=`<div class="challenge-meta"><span>四格填阵</span><strong>A* = (Aⱼᵢ)</strong></div><p class="problem-title">计算下面矩阵的伴随矩阵 A*，把四个数填进正确位置。</p><div class="panel-math"><div class="matrix-line"><span class="mathlabel">A =</span>${mat([[2,3],[1,2]],'mat-large')}<span class="mathsymbol">→</span><span class="mathlabel">A* =</span></div></div><div class="answer-grid-wrap">${matInput()}</div><p class="math-hint" style="text-align:center">依次填写左上、右上、左下、右下。负数请带负号。</p>`}
 if(s===3){body=`<div class="challenge-meta"><span>分数矩阵挑战</span><strong>A⁻¹ = A* / |A|</strong></div><p class="problem-title">先求行列式，再求逆矩阵。答案中会出现分数。</p><div class="panel-math"><div class="matrix-line"><span class="mathlabel">A =</span>${mat([[2,1],[1,2]],'mat-large')}</div></div><div class="entry-row"><label for="detInput">|A| = </label><input id="detInput" class="unit-input" aria-label="矩阵的行列式" inputmode="text" autocomplete="off" placeholder="填数字" value="${esc(state.draft[0]||'')}"></div><div class="answer-grid-wrap"><span class="mathlabel" style="padding-top:22px">A⁻¹ = &nbsp;</span>${matInput('inv')}</div><p class="math-hint" style="text-align:center">分数请输入 2/3 或 -1/3；不能只填伴随矩阵。</p>`}
 if(s===4){const q=FORMULAS[state.step];body=`<div class="challenge-meta"><span>乘法顺序 ${state.step+1} / 3</span><strong>${q.tag}</strong></div><p class="problem-title">已知 A${state.step===2?'、B 均':' '}可逆，怎样从下面的等式解出 X？</p><div class="panel-math"><div class="matrix-line"><span class="formula" style="font-size:29px">${formulaText(q.q)}</span></div></div><div class="choose-row">${q.choices.map((f,i)=>selectionButton(`<span class="formulachoice">${formulaText('X = '+f)}</span>`,String(i),state.selection===String(i))).join('')}</div>`}
 if(s===5){if(state.step===0){body=`<div class="challenge-meta"><span>最终试炼 1 / 3</span><strong>求一个完整的 2 × 2 未知矩阵</strong></div><p class="problem-title">已知 AX = Y，A 可逆。请计算 X 的四个元素，而不是仅求一个列向量。</p><div class="panel-math"><div class="matrix-line"><span class="mathlabel">A =</span>${mat([[2,1],[1,1]])}<span class="mathlabel">Y =</span>${mat([[5,4],[3,2]])}</div><div class="matrix-line" style="margin-top:14px"><span class="mathlabel">A X = Y</span></div></div><div class="answer-grid-wrap"><span class="mathlabel" style="padding-top:21px">X = &nbsp;</span>${matInput('boss')}</div><p class="math-hint" style="text-align:center">你可以先求 A⁻¹，再计算 A⁻¹Y。</p>`}
 else{const p=state.step===1;body=`<div class="challenge-meta"><span>最终试炼 ${state.step+1} / 3</span><strong>奇异矩阵的秘密</strong></div><p class="problem-title">${esc(SPECIAL[state.step-1].q)}</p><div class="panel-math"><div class="matrix-line"><span class="mathlabel">C =</span>${mat([[1,2],[2,4]],'mat-large')}<span class="mathlabel">b =</span>${mat(p?[[3],[6]]:[[3],[7]],'mat-large')}</div></div><div class="choose-row">${[['one','唯一解'],['many','无穷多解'],['none','无解']].map(([v,t])=>selectionButton(t,v,state.selection===v)).join('')}</div>`}}
 return `<div class="board-content">${body}${hintLine()}${feedback()}${bottomAction()}</div>`;
}
function getHint(){switch(state.stage){case 0:return '抓住定义：AB = BA = E。非零、逐个元素取倒数，都不能替代这个条件。';case 1:return '逐个计算 ad−bc，非零的恰好有三个。特别留意两行成比例的矩阵。';case 2:return '对 [[a,b],[c,d]]，伴随矩阵是 [[d,−b],[−c,a]]，右上角不要与左下角写反。';case 3:return '行列式是 2×2−1×1；先把主对角线元素交换、副对角线元素变号，再除以行列式。';case 4:return state.step===0?'未知矩阵在 A 的右侧，必须左乘 A⁻¹。':state.step===1?'XA=Y 时，必须在等式右侧乘 A⁻¹。':'AXB=Y，先左乘 A⁻¹，最后右乘 B⁻¹；注意乘法顺序。';case 5:return state.step===0?'A 的逆矩阵是 [[1,−1],[−1,2]]；用它左乘 Y，逐列计算。':state.step===1?'第二行是第一行的两倍，且右端 6 恰好是 3 的两倍。':'第二行是第一行的两倍，但右端 7 不是 3 的两倍。';default:return ''}}
function calcFraction(s){s=String(s??'').trim().replace(/−/g,'-').replace(/＋/g,'+').replace(/，/g,',').replace(/\s+/g,'');if(!s)return null;const m=s.match(/^([+-]?(?:\d+\.?\d*|\.\d+))(?:\/([+-]?(?:\d+\.?\d*|\.\d+)))?$/);if(!m)return null;const a=Number(m[1]),b=m[2]?Number(m[2]):1;return b!==0&&Number.isFinite(a/b)?a/b:null}
function getInputs(stage){const inputs=[...root.querySelectorAll('[data-input]')].map(el=>el.value.trim());if(stage===3){const det=root.querySelector('#detInput');return [det?.value.trim()||'',...inputs]}return inputs}
function validate(){const s=state.stage;let yes=false,why='',wrong='';
 if(s===0){const q=TRUE_FALSE[state.step];if(state.selection===null){return {yes:false,wrong:'请先选择“正确”或“错误”。',penalty:false}}yes=(state.selection==='true')===q.a;why=q.why;wrong='再看一遍定义，想想这个判断是否存在反例。'}
 if(s===1){if(state.multiselected.length===0)return {yes:false,wrong:'请先选择你认为可逆的矩阵。',penalty:false};const target=[0,2,4];yes=target.length===state.multiselected.length&&target.every(x=>state.multiselected.includes(x));why='M₁：|M₁|=1；M₂：|M₂|=0；M₃：|M₃|=−2；M₄：|M₄|=0；M₅：|M₅|=10。选中的 M₁、M₃、M₅ 恰好都可逆。';wrong='还有矩阵需要重新检查：只有行列式不为零的方阵才可逆。'}
 if(s===2){state.draft=getInputs(s);if(state.draft.some(x=>calcFraction(x)===null))return {yes:false,wrong:'请在四个位置都填写有效数字。',penalty:false};yes=state.draft.map(calcFraction).every((x,i)=>Math.abs(x-[2,-3,-1,2][i])<1e-9);why='A* = [[2,−3],[−1,2]]。先求各个代数余子式，再转置。';wrong='这四个数的符号或位置有误，注意代数余子式矩阵还需要转置。'}
 if(s===3){state.draft=getInputs(s);if(state.draft.some(x=>calcFraction(x)===null))return {yes:false,wrong:'请先填行列式，并补全逆矩阵的四个数字。',penalty:false};yes=state.draft.map(calcFraction).every((x,i)=>Math.abs(x-[3,2/3,-1/3,-1/3,2/3][i])<1e-9);why='|A|=3，A*=[[2,−1],[−1,2]]，所以 A⁻¹=(1/3)A*。';wrong='再确认两件事：行列式是否算对？伴随矩阵是否整体除以行列式？'}
 if(s===4){const q=FORMULAS[state.step];if(state.selection===null)return {yes:false,wrong:'请先选择一个公式。',penalty:false};yes=Number(state.selection)===q.correct;why=q.why;wrong='矩阵乘法通常不满足交换律，试着写出在等式哪一侧乘逆矩阵。'}
 if(s===5){if(state.step===0){state.draft=getInputs(s);if(state.draft.some(x=>calcFraction(x)===null))return {yes:false,wrong:'请完整填写未知矩阵的四个元素。',penalty:false};yes=state.draft.map(calcFraction).every((x,i)=>Math.abs(x-[2,2,1,0][i])<1e-9);why='A⁻¹=[[1,−1],[−1,2]]，所以 X=A⁻¹Y=[[2,2],[1,0]]。代回得 AX=Y。';wrong='检查是否在左侧乘 A⁻¹，并且把 Y 的两列分别计算。'}else{if(state.selection===null)return {yes:false,wrong:'请选择唯一解、无穷多解或无解。',penalty:false};const q=SPECIAL[state.step-1];yes=state.selection===q.target;why=q.why;wrong='先比较两条方程左端是否成比例，再比较右端是否具有相同比例。'}}
 return {yes,why,wrong}}
function submit(){if(state.success)return;const result=validate();if(result.yes){state.success=true;state.feedback='回答正确！这道机关已经解开。';state.feedbackWhy=result.why;}else{state.success=false;state.feedback=result.wrong;state.feedbackWhy='';if(result.penalty!==false){state.errors++}}save();render();}
function nextStep(){if(!state.success)return;if(isLastStep()){const score=Math.max(40,100-state.errors*14-(state.hintUsed?12:0));state.completed.push({index:state.stage,score,errors:state.errors,hint:state.hintUsed});state.phase='clear';state.success=false;state.feedback='';state.feedbackWhy='';state.draft=[];state.selection=null;save();render();scrollTop();return}state.step++;state.selection=null;state.draft=[];state.feedback='';state.feedbackWhy='';state.success=false;save();render();scrollTop()}
function goNextStage(){state.stage++;state.step=0;state.errors=0;state.hintUsed=false;state.hintStep=-1;state.selection=null;state.multiselected=[];state.draft=[];state.success=false;state.feedback='';state.feedbackWhy='';state.phase=state.stage>=6?'finish':'play';save();render();scrollTop()}
function clearScreen(){const s=STAGES[state.stage],p=state.completed[state.completed.length-1];const text=[
  '逆矩阵存在的前提是满足定义：与原矩阵两侧相乘都得到单位矩阵。',
  '二阶矩阵可逆当且仅当 ad − bc ≠ 0；非零方阵未必可逆。',
  '伴随矩阵来自代数余子式矩阵的转置：A* = [[d,−b],[−c,a]]。',
  '当 |A| ≠ 0，逆矩阵为 A⁻¹ = (1/|A|)A*。分母是行列式。',
  'AX=Y 要左乘 A⁻¹；XA=Y 要右乘 A⁻¹；不能交换乘法顺序。',
  '矩阵方程要核对可逆性。奇异方阵可能导致无穷多解，也可能无解。'
 ][state.stage];return layout(s.name,s.subtitle,`<div class="clear"><div class="clear-symbol">✓</div><div class="eyebrow">STAGE ${s.tag} COMPLETED</div><h2>这一关，破了！</h2><p>${s.subtitle}</p><div class="points-earn">+${p.score} <span style="font-size:16px;color:var(--muted)">积分</span></div><div class="summary"><strong>成功解锁的知识</strong><p>${text}</p></div><button class="button" type="button" data-act="advance">${state.stage===5?'领取破阵战绩':'前往下一关 →'}</button></div>`)}
function totalWrong(){return state.completed.reduce((a,b)=>a+b.errors,0)}
function finishScreen(){headerStage.textContent='六关已通关';restartTop.hidden=false;const total=allScore();const label=total>=565?'矩阵大师':total>=490?'破阵高手':total>=390?'进阶破阵者':'坚持的探索者';return `<div class="final"><div class="clear-symbol">◇</div><div class="eyebrow">INVERSE QUEST · MISSION COMPLETE</div><h1>六重阵门，全部解锁</h1><p class="finish-note">你已经完成逆矩阵的概念辨析、可逆判断、伴随矩阵、求逆计算与矩阵方程挑战。</p><div class="score">${total}<small> / 600</small></div><div class="mini-callout" style="max-width:430px;margin:16px auto">你的称号：<strong>${label}</strong></div><div class="finishstats"><div><strong>6 / 6</strong><span>已通关</span></div><div><strong>${totalWrong()}</strong><span>重试次数</span></div><div><strong>${state.hints}</strong><span>使用提示</span></div></div><div class="summary" style="max-width:630px"><strong>你的逆矩阵知识清单</strong><div class="practice-lines"><div>定义：AB = BA = E，B = A⁻¹</div><div>判定：A 可逆 ⇔ |A| ≠ 0</div><div>计算：A⁻¹ = A* / |A|</div><div>方程：AX = Y ⇒ X = A⁻¹Y（A 可逆）</div></div></div><p class="finish-note">保存这一页的截图，记录你的破阵成绩。想挑战更高分，可以重新开始。</p><div class="finish-actions"><button type="button" class="button" data-act="copy">复制通关战绩</button><button type="button" class="button button-secondary" data-act="restart">重新挑战</button></div></div>`}
function render(){let html;if(state.phase==='home')html=home();else if(state.phase==='play')html=layout(STAGES[state.stage].name,STAGES[state.stage].subtitle,stageProblem());else if(state.phase==='clear')html=clearScreen();else html=finishScreen();root.innerHTML=html;}
function reset(){if(state.phase!=='home'&&!confirm('确定重新挑战吗？现有进度和积分会清空。'))return;state=defaultState();save();render();scrollTop();}
function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.classList.add('show');clearTimeout(toast.timeout);toast.timeout=setTimeout(()=>x.classList.remove('show'),2500)}
async function copyReport(){const t=`逆矩阵·破阵行动｜六关全部通关\n得分：${allScore()} / 600\n称号：${allScore()>=565?'矩阵大师':allScore()>=490?'破阵高手':allScore()>=390?'进阶破阵者':'坚持的探索者'}\n答错重试：${totalWrong()} 次｜提示：${state.hints} 次\n游戏网址：https://yuhang-bai.github.io/inverse-matrix-game/`;try{await navigator.clipboard.writeText(t);toast('通关战绩已复制');}catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('通关战绩已复制')}catch(e2){toast('请截图保存战绩')}ta.remove()}}
function handleClick(evt){const btn=evt.target.closest('[data-act]');if(!btn||btn.disabled)return;const act=btn.dataset.act;if(act==='start'){state.phase=state.completed.length===6?'finish':'play';if(!state.startedAt)state.startedAt=Date.now();save();render();scrollTop();}
else if(act==='restart')reset();
else if(act==='pick'){if(state.success)return;state.selection=btn.dataset.value;state.feedback='';state.feedbackWhy='';save();render();}
else if(act==='toggle'){if(state.success)return;const i=Number(btn.dataset.index);state.multiselected=state.multiselected.includes(i)?state.multiselected.filter(x=>x!==i):[...state.multiselected,i];state.feedback='';state.feedbackWhy='';save();render();}
else if(act==='hint'){if(state.hintUsed||state.success)return;state.hintUsed=true;state.hintStep=state.step;state.hints++;state.feedback='';save();render();}
else if(act==='submit')submit();
else if(act==='next')nextStep();
else if(act==='advance')goNextStage();
else if(act==='copy')copyReport();}
root.addEventListener('click',handleClick);
